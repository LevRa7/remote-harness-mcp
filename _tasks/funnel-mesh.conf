
# ---------------------------------------------------------------------------
#  Funnel ingress for the same name (added 2026-10-09).
#
#  `tailscale funnel` terminates TLS on the ts.net name and forwards plain HTTP
#  to a loopback port, so this block is the public front door for it. It must
#  NOT redirect to HTTPS: the client is already on HTTPS, and a redirect would
#  loop forever. It serves exactly what the tailnet-facing vhost above serves -
#  the installers, the node bootstrap payload and the MCP surface - so a phone
#  on a mobile network can install a node with the documented one-liner.
#
#  Before this block existed, Funnel proxied "/" straight to 127.0.0.1:8096,
#  which is the app: it answers /health and /sse but has no static routes, so
#  /install.sh, /install.ps1 and /core/*.py returned 404 (the app first
#  answered 307 to the trailing-slash form, then 404).
# ---------------------------------------------------------------------------
server {
    listen 127.0.0.1:8098;
    server_name racknerd-5a24bf9.merino-carob.ts.net;

    include /etc/nginx/snippets/antigravity-mesh-mcp.conf;

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Target-User "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
